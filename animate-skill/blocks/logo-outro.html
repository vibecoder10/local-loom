<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;700&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: transparent; overflow: hidden; }
      body { width: 1920px; height: 1080px; font-family: "Outfit", sans-serif; color: #FFFFFF; }

      [data-composition-id="logo-outro-puvindren"] {
        width: 1920px; height: 1080px;
        background: #000000;
        overflow: hidden;
        position: relative;
      }

      [data-composition-id="logo-outro-puvindren"] .scene {
        position: relative;
        width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
      }

      /* Vignette */
      [data-composition-id="logo-outro-puvindren"] .vignette {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
        pointer-events: none;
        z-index: 1;
      }

      /* Glow bloom layer */
      [data-composition-id="logo-outro-puvindren"] .bloom {
        position: absolute;
        top: 50%; left: 50%;
        margin-left: -400px; margin-top: -350px;
        width: 800px; height: 800px;
        background: radial-gradient(circle, rgba(81,140,22,0.55), rgba(81,140,22,0.18) 30%, transparent 65%);
        pointer-events: none;
        filter: blur(40px);
        opacity: 0;
        z-index: 1;
      }

      /* Logo (asterisk) */
      [data-composition-id="logo-outro-puvindren"] .logo {
        width: 240px; height: 240px;
        position: relative;
        z-index: 3;
      }

      [data-composition-id="logo-outro-puvindren"] .logo line {
        stroke: #FFFFFF;
        stroke-width: 12;
        stroke-linecap: round;
        stroke-dasharray: 200;
        stroke-dashoffset: 200;
        filter: drop-shadow(0 0 0px rgba(255,255,255,0));
      }

      /* Name */
      [data-composition-id="logo-outro-puvindren"] .name {
        font-family: "Outfit", sans-serif;
        font-weight: 600;
        font-size: 110px;
        line-height: 0.95;
        letter-spacing: -0.04em;
        color: #FFFFFF;
        opacity: 0;
        z-index: 3;
        position: relative;
      }

      [data-composition-id="logo-outro-puvindren"] .name .word {
        display: inline-block;
        margin-right: 24px;
      }
      [data-composition-id="logo-outro-puvindren"] .name .word:last-child { margin-right: 0; }

      /* Tagline */
      [data-composition-id="logo-outro-puvindren"] .tagline {
        font-family: "Outfit", sans-serif;
        font-weight: 300;
        font-size: 38px;
        letter-spacing: -0.01em;
        color: #c8c8c8;
        opacity: 0;
        z-index: 3;
        position: relative;
        text-align: center;
      }
      [data-composition-id="logo-outro-puvindren"] .tagline em {
        font-style: normal;
        font-weight: 600;
        color: #FFFFFF;
      }

      /* URL pill */
      [data-composition-id="logo-outro-puvindren"] .url-pill {
        display: inline-flex; align-items: center; gap: 14px;
        padding: 16px 28px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 100px;
        font-family: "Geist Mono", monospace;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: #FFFFFF;
        text-transform: uppercase;
        backdrop-filter: blur(8px);
        opacity: 0;
        z-index: 3;
        position: relative;
        margin-top: 24px;
      }

      [data-composition-id="logo-outro-puvindren"] .url-pill .dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #518C16;
        box-shadow: 0 0 12px #518C16;
      }

      /* Subtle ambient grain */
      [data-composition-id="logo-outro-puvindren"] .grain {
        position: absolute; inset: 0;
        background:
          radial-gradient(1200px at 30% 20%, rgba(81,140,22,0.05), transparent 60%),
          radial-gradient(900px at 70% 80%, rgba(81,140,22,0.04), transparent 60%);
        pointer-events: none;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="logo-outro-puvindren"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="6"
    >
      <div class="vignette"></div>
      <div class="grain"></div>
      <div id="bloom" class="bloom"></div>

      <div id="stage" class="clip scene" data-start="0" data-duration="6" data-track-index="0">
        <svg id="logo" class="logo" viewBox="0 0 100 100" fill="none">
          <line id="stroke-1" x1="50" y1="10" x2="50" y2="90"/>
          <line id="stroke-2" x1="10" y1="50" x2="90" y2="50"/>
          <line id="stroke-3" x1="21" y1="21" x2="79" y2="79"/>
          <line id="stroke-4" x1="79" y1="21" x2="21" y2="79"/>
        </svg>

        <div class="name" id="name">
          <span class="word" id="word-1">Puvin</span>
          <span class="word" id="word-2">Supra</span>
        </div>

        <div class="tagline" id="tagline">
          expert in <em>CMS</em>, <em>UI/UX</em>, &amp; <em>SEO</em>
        </div>

        <div class="url-pill" id="url-pill">
          <span class="dot"></span>
          PUVINDREN.COM
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var bloom = document.getElementById("bloom");
      var logo = document.getElementById("logo");
      var strokes = [
        document.getElementById("stroke-1"),
        document.getElementById("stroke-2"),
        document.getElementById("stroke-3"),
        document.getElementById("stroke-4")
      ];
      var name = document.getElementById("name");
      var words = document.querySelectorAll('[data-composition-id="logo-outro-puvindren"] .word');
      var tagline = document.getElementById("tagline");
      var urlPill = document.getElementById("url-pill");

      // Initial states
      gsap.set(logo, { scale: 0.6, opacity: 0 });
      gsap.set(words, { opacity: 0, y: 40 });

      // === Phase 1: Logo materializes (0-2s) ===

      // Logo container fade + scale in
      tl.fromTo(logo,
        { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power2.out" },
        0
      );

      // Strokes draw in piece-by-piece (4 strokes, staggered)
      tl.fromTo(strokes,
        { strokeDashoffset: 200 },
        { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut", stagger: 0.18 },
        0.2
      );

      // === Phase 2: Glow bloom + logo punch (1.7-2.4s) ===

      // Bloom expands from logo center
      tl.fromTo(bloom,
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1.0, duration: 0.7, ease: "power2.out" },
        1.6
      );

      // Logo scale punch
      tl.to(logo, { scale: 1.08, duration: 0.25, ease: "back.out(2)" }, 1.7);
      tl.to(logo, { scale: 1.0, duration: 0.3, ease: "power2.out" }, 1.95);

      // Stroke glow
      tl.to(strokes, {
        filter: "drop-shadow(0 0 24px rgba(255,255,255,0.7))",
        duration: 0.4,
        ease: "power2.out"
      }, 1.7);

      // === Phase 3: Name reveal (2.2-3.2s) ===

      tl.to(name, { opacity: 1, duration: 0.05 }, 2.2);

      tl.fromTo(words,
        { opacity: 0, y: 40 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.14 },
        2.2
      );

      // === Phase 4: Tagline (3.0-3.8s) ===

      tl.fromTo(tagline,
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
        3.0
      );

      // === Phase 5: URL pill (3.7-4.3s) ===

      tl.fromTo(urlPill,
        { opacity: 0, y: 30, scale: 0.9 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" },
        3.7
      );

      // === Phase 6: Mid-scene activity / hold (4.3-6.0s) ===

      // Bloom continues to gently pulse
      tl.to(bloom, {
        opacity: 0.7,
        scale: 1.05,
        duration: 0.85,
        yoyo: true,
        repeat: 1,
        ease: "sine.inOut"
      }, 4.3);

      // Logo gentle breathe
      tl.to(logo, {
        scale: 1.03,
        duration: 0.85,
        yoyo: true,
        repeat: 1,
        ease: "sine.inOut"
      }, 4.3);

      // Subtle name lift to keep frame alive
      tl.to(words, {
        y: -4,
        duration: 1.0,
        yoyo: true,
        repeat: 1,
        ease: "sine.inOut",
        stagger: 0.05
      }, 4.4);

      window.__timelines["logo-outro-puvindren"] = tl;
    </script>
  </body>
</html>
