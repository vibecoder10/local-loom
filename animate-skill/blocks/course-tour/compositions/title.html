<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400;1,600&family=JetBrains+Mono:wght@400;500;700&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: transparent; overflow: hidden; }
      body { width: 1920px; height: 1080px; font-family: "Outfit", sans-serif; }

      [data-composition-id="title"] {
        width: 1920px; height: 1080px;
        background: #000000;
        overflow: hidden;
        position: relative;
        font-family: "Outfit", sans-serif;
      }

      /* Hexagon ambient bg */
      [data-composition-id="title"] .hex-bg {
        position: absolute; inset: 0;
        background-image:
          radial-gradient(900px at 20% 20%, rgba(255,107,26,0.08), transparent 60%),
          radial-gradient(700px at 80% 80%, rgba(139,92,246,0.06), transparent 60%);
        z-index: 1;
      }

      [data-composition-id="title"] .grid-overlay {
        position: absolute; inset: 0;
        background-size: 60px 60px;
        background-image:
          linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
        mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
        -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
        z-index: 2;
      }

      [data-composition-id="title"] .stage {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 36px;
        z-index: 5;
        padding: 0 80px;
      }

      [data-composition-id="title"] .kicker {
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.32em;
        color: #ff6b1a;
        text-transform: uppercase;
        display: inline-flex; align-items: center; gap: 14px;
        padding: 10px 22px;
        background: rgba(255,107,26,0.06);
        border: 1px solid rgba(255,107,26,0.22);
        border-radius: 100px;
      }
      [data-composition-id="title"] .kicker .hex { width: 14px; height: 14px; }

      [data-composition-id="title"] .display {
        font-family: "Source Serif 4", serif;
        font-weight: 400;
        font-size: 140px;
        line-height: 0.95;
        letter-spacing: -0.02em;
        color: #f1ece0;
        text-align: center;
      }

      [data-composition-id="title"] .display em {
        font-style: italic;
        background: linear-gradient(180deg, #ff8b3a, #ff6b1a);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      [data-composition-id="title"] .display .word {
        display: inline-block;
        margin-right: 18px;
      }

      [data-composition-id="title"] .meta {
        display: inline-flex; align-items: center; gap: 18px;
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: #f1ece0;
        text-transform: uppercase;
        padding: 14px 26px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 100px;
        backdrop-filter: blur(10px);
      }

      [data-composition-id="title"] .meta strong { color: #ff6b1a; font-weight: 800; }
      [data-composition-id="title"] .meta .dot {
        width: 4px; height: 4px;
        border-radius: 50%;
        background: rgba(255,255,255,0.4);
      }

      [data-composition-id="title"] .module-pills {
        display: flex; gap: 12px;
        margin-top: 24px;
        opacity: 0;
      }

      [data-composition-id="title"] .module-pills .pill {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.22em;
        padding: 8px 18px;
        border-radius: 100px;
        background: rgba(255,255,255,0.03);
        border: 1px solid;
        color: var(--c, #fff);
        text-transform: uppercase;
        opacity: 0;
      }
      [data-composition-id="title"] .pill.p1 { --c: #8b5cf6; border-color: rgba(139,92,246,0.4); }
      [data-composition-id="title"] .pill.p2 { --c: #ff6b1a; border-color: rgba(255,107,26,0.4); }
      [data-composition-id="title"] .pill.p3 { --c: #22d3ee; border-color: rgba(34,211,238,0.4); }
      [data-composition-id="title"] .pill.p4 { --c: #50e3c2; border-color: rgba(80,227,194,0.4); }
      [data-composition-id="title"] .pill.p5 { --c: #f5a623; border-color: rgba(245,166,35,0.4); }
      [data-composition-id="title"] .pill.p6 { --c: #f472b6; border-color: rgba(244,114,182,0.4); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="title"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="7"
    >
      <div class="hex-bg"></div>
      <div class="grid-overlay"></div>

      <div class="stage" id="stage">
        <div id="kicker" class="kicker">
          <svg class="hex" viewBox="0 0 100 100"><polygon points="50,5 93,28 93,72 50,95 7,72 7,28" fill="#ff6b1a"/></svg>
          AGENTIC AI FOUNDATIONS
        </div>

        <div class="display">
          <span class="word" id="word-1">Zero</span>
          <span class="word" id="word-2">to</span>
          <span class="word" id="word-3"><em>mastery</em></span>
          <br/>
          <span class="word" id="word-4">with</span>
          <span class="word" id="word-5">AI</span>
          <span class="word" id="word-6">agents.</span>
        </div>

        <div id="meta" class="meta">
          <strong>6</strong>
          <span>modules</span>
          <span class="dot"></span>
          <span>tool-agnostic</span>
          <span class="dot"></span>
          <span>community-exclusive</span>
        </div>

        <div class="module-pills" id="pills">
          <div class="pill p1" id="pill-1">M1 Anatomy</div>
          <div class="pill p2" id="pill-2">M2 Deep Dive</div>
          <div class="pill p3" id="pill-3">M3 Language</div>
          <div class="pill p4" id="pill-4">M4 Techniques</div>
          <div class="pill p5" id="pill-5">M5 Orchestration</div>
          <div class="pill p6" id="pill-6">M6 Command Centre</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var kicker = document.getElementById("kicker");
      var words = document.querySelectorAll('[data-composition-id="title"] .display .word');
      var meta = document.getElementById("meta");
      var pills = document.getElementById("pills");
      var pillEls = document.querySelectorAll('[data-composition-id="title"] .pill');

      // Kicker
      tl.fromTo(kicker,
        { opacity: 0, y: -20, scale: 0.9 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" },
        0
      );

      // Headline words stagger
      tl.fromTo(words,
        { opacity: 0, y: 50, filter: "blur(12px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out", stagger: 0.08 },
        0.3
      );

      // Meta pill
      tl.fromTo(meta,
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.6
      );

      // Module pills
      tl.fromTo(pills, { opacity: 1 }, { opacity: 1, duration: 0.01 }, 2.0);
      tl.fromTo(pillEls,
        { opacity: 0, y: 14, scale: 0.85 },
        { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.4)", stagger: 0.07 },
        2.0
      );

      // Mid-scene breathe
      tl.to(words, { y: -3, duration: 1.5, yoyo: true, repeat: 1, ease: "sine.inOut", stagger: 0.04 }, 4.0);

      // Exit
      tl.to([kicker, words, meta, pillEls], {
        opacity: 0,
        y: -30,
        duration: 0.5,
        ease: "power2.in",
        stagger: 0.02
      }, 6.3);

      tl.set([kicker, meta, pills], { opacity: 0, visibility: "hidden" }, 6.95);

      window.__timelines["title"] = tl;
    </script>
  </body>
</html>
