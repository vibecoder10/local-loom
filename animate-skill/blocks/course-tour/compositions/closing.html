<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400;1,600&family=JetBrains+Mono:wght@400;500;700&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: transparent; overflow: hidden; }
      body { width: 1920px; height: 1080px; font-family: "Outfit", sans-serif; }

      [data-composition-id="closing"] {
        width: 1920px; height: 1080px;
        background: #000000;
        overflow: hidden;
        position: relative;
        font-family: "Outfit", sans-serif;
      }

      [data-composition-id="closing"] .ambient {
        position: absolute; inset: 0;
        background:
          radial-gradient(700px at 50% 50%, rgba(255,107,26,0.18), transparent 60%);
        z-index: 1;
      }

      [data-composition-id="closing"] .stage {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 36px;
        z-index: 5;
        padding: 0 80px;
      }

      [data-composition-id="closing"] .asterisk {
        width: 100px; height: 100px;
      }

      [data-composition-id="closing"] .heading {
        font-family: "Source Serif 4", serif;
        font-weight: 400;
        font-size: 140px;
        line-height: 0.95;
        letter-spacing: -0.02em;
        color: #f1ece0;
        text-align: center;
      }
      [data-composition-id="closing"] .heading em {
        font-style: italic;
        background: linear-gradient(180deg, #ff8b3a, #ff6b1a);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      [data-composition-id="closing"] .url-pill {
        display: inline-flex; align-items: center; gap: 14px;
        padding: 14px 26px;
        background: rgba(255,107,26,0.08);
        border: 1px solid rgba(255,107,26,0.4);
        border-radius: 100px;
        font-family: "JetBrains Mono", monospace;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: #ff6b1a;
        text-transform: uppercase;
        backdrop-filter: blur(10px);
      }
      [data-composition-id="closing"] .url-pill .dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #ff6b1a;
        box-shadow: 0 0 12px #ff6b1a;
      }

      [data-composition-id="closing"] .brand {
        position: absolute;
        bottom: 60px; left: 50%;
        transform: translateX(-50%);
        display: inline-flex; align-items: center; gap: 8px;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: rgba(255,255,255,0.5);
        text-transform: uppercase;
      }
      [data-composition-id="closing"] .brand .ROBO { color: #fff; font-weight: 800; }
      [data-composition-id="closing"] .brand .LABS { color: rgba(255,255,255,0.4); font-weight: 300; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="closing"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="4"
    >
      <div class="ambient"></div>

      <div class="stage clip" id="stage" data-start="0" data-duration="4" data-track-index="0">
        <svg id="asterisk" class="asterisk" viewBox="0 0 100 100" fill="none">
          <g stroke="#ff6b1a" stroke-width="6" stroke-linecap="round">
            <line x1="50" y1="10" x2="50" y2="90"/>
            <line x1="10" y1="50" x2="90" y2="50"/>
            <line x1="21" y1="21" x2="79" y2="79"/>
            <line x1="79" y1="21" x2="21" y2="79"/>
          </g>
        </svg>

        <div class="heading">Join the <em>community</em>.</div>

        <div id="url-pill" class="url-pill">
          <span class="dot"></span>
          ROBONUGGETS.COM
        </div>
      </div>

      <div class="brand">
        <span class="ROBO">ROBO</span><span class="LABS">NUGGETS</span> &middot; THE ROBO GROUP
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var asterisk = document.getElementById("asterisk");
      var heading = document.querySelector('[data-composition-id="closing"] .heading');
      var pill = document.getElementById("url-pill");
      var brand = document.querySelector('[data-composition-id="closing"] .brand');

      tl.fromTo(asterisk,
        { opacity: 0, rotation: -180, transformOrigin: "50% 50%" },
        { opacity: 1, rotation: 0, duration: 0.7, ease: "back.out(1.5)" },
        0.1
      );

      tl.fromTo(heading,
        { opacity: 0, y: 30, filter: "blur(12px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "expo.out" },
        0.4
      );

      tl.fromTo(pill,
        { opacity: 0, y: 20, scale: 0.9 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.4)" },
        1.0
      );

      tl.fromTo(brand,
        { opacity: 0 },
        { opacity: 1, duration: 0.5 },
        1.4
      );

      window.__timelines["closing"] = tl;
    </script>
  </body>
</html>
