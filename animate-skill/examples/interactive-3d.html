<!-- Ported from a React/shadcn integration:
     - SplineScene (lazy @splinetool/react-spline)  -> <spline-viewer> web component
     - Aceternity Spotlight (CSS animate-spotlight) -> GSAP-driven SVG tween
     - shadcn Card                                  -> plain div with Tailwind-equivalent styles
     Wise-themed copy.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    margin: 0; width: 1920px; height: 1080px;
    overflow: hidden; background: #050505;
  }
</style>
</head>
<body>
<div
  id="interactive-3d"
  data-composition-id="interactive-3d"
  data-start="0"
  data-duration="8"
  data-width="1920"
  data-height="1080"
>
  <!-- Card (shadcn Card port) -->
  <div id="i3d-card">
    <!-- Spotlight (Aceternity port) -->
    <svg
      id="i3d-spotlight"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 3787 2842"
      fill="none"
    >
      <g filter="url(#i3d-filter)">
        <ellipse
          cx="1924.71" cy="273.501" rx="1924.71" ry="273.501"
          transform="matrix(-0.822377 -0.568943 -0.568943 0.822377 3631.88 2291.09)"
          fill="#9FE870" fill-opacity="0.21"
        />
      </g>
      <defs>
        <filter id="i3d-filter" x="0.86" y="0.84" width="3785.16" height="2840.26"
                filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
          <feFlood flood-opacity="0" result="BackgroundImageFix" />
          <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape" />
          <feGaussianBlur stdDeviation="151" result="effect1_foregroundBlur_1065_8" />
        </filter>
      </defs>
    </svg>

    <!-- Two-column content -->
    <div id="i3d-flex">
      <!-- Left content -->
      <div id="i3d-left">
        <h1 id="i3d-headline">Money in motion</h1>
        <p id="i3d-sub">
          Send across <span class="i3d-accent">70+ currencies</span> with one tap.<br/>
          Real exchange rates. No hidden fees.
        </p>
      </div>

      <!-- Right content: 3D scene -->
      <div id="i3d-right">
        <!-- Try real Spline first; fallback mock sits underneath if WebGL fails -->
        <spline-viewer
          id="i3d-spline"
          url="https://prod.spline.design/kZDDjO5HuC9GJUM2/scene.splinecode"
          loading-anim="false"
          events-target="global"
        ></spline-viewer>

        <!-- CSS/SVG fallback mock  -  hidden by default; will show if Spline doesn't load -->
        <div id="i3d-fallback">
          <div id="i3d-card-3d">
            <div class="i3d-card-face i3d-card-front">
              <div class="i3d-card-chip"></div>
              <div class="i3d-card-wordmark">wise</div>
            </div>
          </div>
          <!-- Floating currency satellites -->
          <div class="i3d-coin i3d-coin-1">€</div>
          <div class="i3d-coin i3d-coin-2">£</div>
          <div class="i3d-coin i3d-coin-3">$</div>
          <div class="i3d-coin i3d-coin-4">¥</div>
        </div>
      </div>
    </div>
  </div>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap");

    #interactive-3d {
      position: relative; width: 1920px; height: 1080px;
      font-family: "Inter", system-ui, sans-serif;
      background: #050505;
    }

    /* shadcn Card port  -  bg-black/[0.96] rounded-lg border */
    #interactive-3d #i3d-card {
      position: absolute; inset: 0;
      background: rgba(0, 0, 0, 0.96);
      overflow: hidden;
    }

    /* Aceternity Spotlight  -  placed top-left, will be animated by GSAP */
    #interactive-3d #i3d-spotlight {
      position: absolute;
      top: -160px; left: 240px;
      width: 138%; height: 169%;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transform: translate(-72%, -62%) scale(0.5);
      transform-origin: 50% 50%;
    }

    /* Two-column flex layout */
    #interactive-3d #i3d-flex {
      position: relative; z-index: 10;
      display: flex; height: 100%;
    }
    #interactive-3d #i3d-left {
      flex: 1; padding: 110px 90px;
      display: flex; flex-direction: column;
      justify-content: center;
    }
    #interactive-3d #i3d-headline {
      font-size: 96px; font-weight: 700;
      line-height: 1.0; letter-spacing: -0.02em;
      background: linear-gradient(180deg, #FAFAFA 0%, #BFBFBF 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    #interactive-3d #i3d-sub {
      margin-top: 32px;
      font-size: 28px; font-weight: 300;
      line-height: 1.5; color: #B5B5B5;
      max-width: 640px;
    }
    #interactive-3d .i3d-accent {
      color: #9FE870; font-weight: 600;
    }

    #interactive-3d #i3d-right {
      flex: 1; position: relative;
    }
    #interactive-3d #i3d-spline {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      z-index: 3;
      background: transparent;
    }

    /* Fallback mock 3D scene (sits beneath Spline; visible if Spline empty) */
    #interactive-3d #i3d-fallback {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      perspective: 1500px;
      z-index: 2;
    }
    #interactive-3d #i3d-card-3d {
      width: 380px; height: 240px;
      transform-style: preserve-3d;
      position: relative;
      will-change: transform;
    }
    #interactive-3d .i3d-card-face {
      position: absolute; inset: 0;
      border-radius: 24px;
      background: linear-gradient(135deg, #BFFF8A 0%, #9FE870 50%, #5CB835 100%);
      box-shadow: 0 30px 80px rgba(159, 232, 112, 0.45);
      backface-visibility: hidden;
      padding: 30px;
      display: flex; flex-direction: column;
      justify-content: space-between;
    }
    #interactive-3d .i3d-card-chip {
      width: 56px; height: 42px;
      border-radius: 8px;
      background: linear-gradient(135deg, #163300, #2C5530);
      box-shadow: inset 0 2px 8px rgba(255, 255, 255, 0.2);
    }
    #interactive-3d .i3d-card-wordmark {
      font-size: 56px; font-weight: 800;
      color: #163300; letter-spacing: -1.5px;
      align-self: flex-start;
    }
    #interactive-3d .i3d-coin {
      position: absolute;
      width: 70px; height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #DFFFB0, #9FE870 60%, #5CB835);
      display: flex; align-items: center; justify-content: center;
      color: #163300; font-size: 36px; font-weight: 800;
      box-shadow: 0 0 30px rgba(159, 232, 112, 0.5);
      will-change: transform;
    }
    #interactive-3d .i3d-coin-1 { top: 22%; left: 18%; }
    #interactive-3d .i3d-coin-2 { top: 18%; right: 14%; }
    #interactive-3d .i3d-coin-3 { bottom: 26%; left: 12%; }
    #interactive-3d .i3d-coin-4 { bottom: 22%; right: 16%; }
  </style>

  <!-- Spline viewer web component (loads scene from .splinecode URL) -->
  <script type="module"
    src="https://unpkg.com/@splinetool/viewer@1.9.28/build/spline-viewer.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var S = "#interactive-3d ";

      // Spotlight animation (port of Tailwind animate-spotlight: 2s ease 0.75s 1 forwards)
      tl.to(S + "#i3d-spotlight", {
        opacity: 1,
        x: 0, y: 0,
        scale: 1,
        duration: 2.0,
        ease: "power2.out",
        onStart: function () {
          gsap.set(S + "#i3d-spotlight", { transform: "translate(-50%, -40%) scale(1)" });
        },
      }, 0.75);

      // Headline gradient text fade up
      tl.from(S + "#i3d-headline", {
        opacity: 0, y: 40, duration: 1.0, ease: "power3.out",
      }, 0.4);

      // Subhead fade up
      tl.from(S + "#i3d-sub", {
        opacity: 0, y: 24, duration: 0.9, ease: "power2.out",
      }, 0.9);

      // Fallback 3D card rotates continuously (visible only if Spline doesn't load)
      tl.fromTo(S + "#i3d-card-3d",
        { rotateY: -28, rotateX: 8 },
        { rotateY: 28, rotateX: -8, duration: 8, ease: "sine.inOut" },
      0);

      // Floating coins parallax
      tl.fromTo(S + ".i3d-coin-1", { y: 0 },     { y: -30, duration: 8, ease: "sine.inOut" }, 0);
      tl.fromTo(S + ".i3d-coin-2", { y: 0 },     { y: 24,  duration: 8, ease: "sine.inOut" }, 0);
      tl.fromTo(S + ".i3d-coin-3", { y: 0 },     { y: -22, duration: 8, ease: "sine.inOut" }, 0);
      tl.fromTo(S + ".i3d-coin-4", { y: 0 },     { y: 28,  duration: 8, ease: "sine.inOut" }, 0);

      // Coins fade in
      tl.from(S + ".i3d-coin",
        { opacity: 0, scale: 0.5, duration: 0.8, ease: "back.out(1.4)", stagger: 0.1 },
      1.5);

      window.__timelines["interactive-3d"] = tl;
    })();
  </script>
</div>
</body>
</html>
