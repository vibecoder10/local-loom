<!-- hyperframes-registry-item: app-showcase (customised for Wise) -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>app-showcase</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px;
        overflow: hidden; background-color: #0A1F00;
      }
    </style>
  </head>
  <body>
    <div
      data-composition-id="app-showcase"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="5.5"
    >
      <!-- Background -->
      <div class="s3-bg" id="s3Bg"></div>
      <div class="s3-bg-glow" id="s3BgGlow"></div>

      <div class="s3-stage" id="s3Stage">

        <!-- ═══════════════════════════════════════
             LEFT PHONE  -  Send Money CTA
        ═══════════════════════════════════════ -->
        <div class="s3-phone s3-phone-left" id="s3PhoneLeft">
          <div class="s3-bezel">
            <div class="s3-notch"></div>
            <div class="s3-screen s3-screen-left">
              <div class="left-shapes">
                <svg viewBox="0 0 304 400" xmlns="http://www.w3.org/2000/svg" fill="none">
                  <!-- Stylised arrow / send motion -->
                  <circle cx="152" cy="120" r="58" fill="#163300" opacity="0.12" />
                  <path d="M110 120 L194 120 M170 96 L194 120 L170 144"
                        stroke="#163300" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
                  <!-- Decorative arcs -->
                  <path d="M60 280 Q152 220 244 280" stroke="#9FE870" stroke-width="3" fill="none" opacity="0.55" />
                  <path d="M40 310 Q152 240 264 310" stroke="#9FE870" stroke-width="2" fill="none" opacity="0.35" />
                </svg>
              </div>
              <div class="left-bottom">
                <div class="left-tagline" id="s3Tagline">Send money to 70+ countries</div>
                <div class="left-cta">GET STARTED</div>
              </div>
            </div>
          </div>
        </div>

        <!-- ═══════════════════════════════════════
             CENTER PHONE  -  Balance Dashboard
        ═══════════════════════════════════════ -->
        <div class="s3-phone s3-phone-center" id="s3PhoneCenter">
          <div class="s3-bezel">
            <div class="s3-notch"></div>
            <div class="s3-screen s3-screen-center">
              <!-- Header -->
              <div class="center-header">
                <div class="center-avatar">JD</div>
                <div class="center-user-info">
                  <div class="center-name">Alex Doe</div>
                  <div class="center-subtitle">Personal account</div>
                </div>
                <div class="center-bell">
                  <svg viewBox="0 0 20 20" width="20" height="20" fill="none">
                    <path d="M10 2a5 5 0 00-5 5v3l-1.5 2.5h13L15 10V7a5 5 0 00-5-5z"
                          stroke="#7c857c" stroke-width="1.4" stroke-linejoin="round"/>
                    <path d="M8 16.5a2 2 0 004 0" stroke="#7c857c" stroke-width="1.4" stroke-linecap="round"/>
                    <circle cx="14" cy="5" r="3" fill="#9FE870" />
                  </svg>
                </div>
              </div>

              <!-- Total balance card -->
              <div class="center-goal">
                <div class="goal-label">Total balance</div>
                <div class="goal-ring-wrap">
                  <svg class="goal-ring" viewBox="0 0 140 140">
                    <circle class="ring-track" cx="70" cy="70" r="52" fill="none" stroke="#333" stroke-width="10"/>
                    <circle class="ring-fill" id="s3Ring" cx="70" cy="70" r="52" fill="none"
                            stroke="#9FE870" stroke-width="10" stroke-linecap="round"
                            transform="rotate(-90 70 70)"/>
                  </svg>
                  <div class="goal-count">
                    <span class="goal-cur">£</span>
                    <span class="goal-num">8,420</span>
                  </div>
                </div>
                <div class="goal-days">
                  <span class="day done">£</span>
                  <span class="day done">€</span>
                  <span class="day done">$</span>
                  <span class="day">¥</span>
                  <span class="day">A$</span>
                  <span class="day">CHF</span>
                  <span class="day">+45</span>
                </div>
              </div>

              <!-- Holdings -->
              <div class="center-progress">
                <div class="progress-header">
                  <span class="progress-title">Your balances</span>
                  <span class="progress-link">See all</span>
                </div>
                <div class="progress-bars">
                  <div class="bar-row">
                    <div class="bar-icon">
                      <span class="flag-letter">£</span>
                    </div>
                    <div class="bar-info">
                      <span class="bar-name">GBP</span>
                      <span class="bar-val">£4,200</span>
                    </div>
                    <div class="bar-track"><div class="bar-value bar-v1" id="s3Bar1"></div></div>
                  </div>
                  <div class="bar-row">
                    <div class="bar-icon">
                      <span class="flag-letter">€</span>
                    </div>
                    <div class="bar-info">
                      <span class="bar-name">EUR</span>
                      <span class="bar-val">€2,840</span>
                    </div>
                    <div class="bar-track"><div class="bar-value bar-v2" id="s3Bar2"></div></div>
                  </div>
                  <div class="bar-row">
                    <div class="bar-icon">
                      <span class="flag-letter">$</span>
                    </div>
                    <div class="bar-info">
                      <span class="bar-name">USD</span>
                      <span class="bar-val">$1,380</span>
                    </div>
                    <div class="bar-track"><div class="bar-value bar-v3" id="s3Bar3"></div></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ═══════════════════════════════════════
             RIGHT PHONE  -  Spending Graph
        ═══════════════════════════════════════ -->
        <div class="s3-phone s3-phone-right" id="s3PhoneRight">
          <div class="s3-bezel">
            <div class="s3-notch"></div>
            <div class="s3-screen s3-screen-right">
              <div class="right-header">
                <div class="right-title">This month spent</div>
                <div class="right-value">£2,840 <span class="right-unit">.40</span></div>
              </div>

              <div class="right-graph-wrap">
                <svg class="right-graph" viewBox="0 0 260 130" xmlns="http://www.w3.org/2000/svg">
                  <line x1="10" y1="25"  x2="250" y2="25"  stroke="#9FE870" stroke-width="0.5" opacity="0.4"/>
                  <line x1="10" y1="55"  x2="250" y2="55"  stroke="#9FE870" stroke-width="0.5" opacity="0.4"/>
                  <line x1="10" y1="85"  x2="250" y2="85"  stroke="#9FE870" stroke-width="0.5" opacity="0.4"/>
                  <line x1="10" y1="115" x2="250" y2="115" stroke="#9FE870" stroke-width="0.5" opacity="0.4"/>
                  <path class="graph-area" id="s3GraphArea"
                        d="M10,105 L50,80 90,90 130,45 170,60 210,25 250,35 250,115 10,115 Z"
                        fill="#9FE870" opacity="0.18"/>
                  <polyline class="graph-line" id="s3GraphLine"
                            points="10,105 50,80 90,90 130,45 170,60 210,25 250,35"
                            fill="none" stroke="#9FE870" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round"/>
                  <circle class="graph-dot" cx="10" cy="105" r="3.5" fill="#9FE870" />
                  <circle class="graph-dot" cx="50" cy="80"  r="3.5" fill="#9FE870" />
                  <circle class="graph-dot" cx="90" cy="90"  r="3.5" fill="#9FE870" />
                  <circle class="graph-dot" cx="130" cy="45" r="3.5" fill="#9FE870" />
                  <circle class="graph-dot" cx="170" cy="60" r="3.5" fill="#9FE870" />
                  <circle class="graph-dot" cx="210" cy="25" r="3.5" fill="#9FE870" />
                  <circle class="graph-dot" cx="250" cy="35" r="3.5" fill="#9FE870" />
                </svg>
                <div class="right-labels">
                  <span>Wk1</span><span>Wk2</span><span>Wk3</span><span>Wk4</span>
                </div>
              </div>

              <div class="right-stats">
                <div class="stat-pill">
                  <span class="stat-dot" style="background: #9FE870"></span>
                  <span class="stat-label">Card</span>
                  <span class="stat-num">£1,940</span>
                </div>
                <div class="stat-pill">
                  <span class="stat-dot" style="background: #5CB835"></span>
                  <span class="stat-label">Sent</span>
                  <span class="stat-num">£900</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <style>
        @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap");

        [data-composition-id="app-showcase"] {
          position: relative; width: 1920px; height: 1080px;
          overflow: hidden; font-family: "DM Sans", sans-serif; color: #163300;
        }

        /* ── Background  -  Wise green palette ── */
        [data-composition-id="app-showcase"] .s3-bg {
          position: absolute; inset: 0;
          background: linear-gradient(160deg, #163300 0%, #0A1F00 50%, #163300 100%);
        }
        [data-composition-id="app-showcase"] .s3-bg-glow {
          position: absolute; width: 1100px; height: 1100px;
          top: 50%; left: 50%; transform: translate(-50%, -50%);
          background: radial-gradient(circle, rgba(159, 232, 112, 0.25) 0%, transparent 65%);
          border-radius: 50%;
        }

        [data-composition-id="app-showcase"] .s3-stage {
          position: absolute; inset: 0; transform-origin: center center;
        }

        /* Phones */
        [data-composition-id="app-showcase"] .s3-phone {
          position: absolute; width: 320px; height: 650px;
          top: 215px; left: 800px;
        }
        [data-composition-id="app-showcase"] .s3-phone-center { z-index: 30; }
        [data-composition-id="app-showcase"] .s3-phone-left  { z-index: 20; }
        [data-composition-id="app-showcase"] .s3-phone-right { z-index: 20; }

        [data-composition-id="app-showcase"] .s3-bezel {
          width: 100%; height: 100%; border-radius: 42px;
          background: #0A1F00; padding: 8px;
          box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55), 0 4px 16px rgba(0, 0, 0, 0.3);
          position: relative; overflow: hidden;
        }
        [data-composition-id="app-showcase"] .s3-notch {
          position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
          width: 100px; height: 26px; background: #0A1F00;
          border-radius: 0 0 18px 18px; z-index: 5;
        }
        [data-composition-id="app-showcase"] .s3-screen {
          width: 100%; height: 100%; border-radius: 36px;
          overflow: hidden; position: relative;
        }

        /* Left screen  -  bright green CTA card */
        [data-composition-id="app-showcase"] .s3-screen-left {
          background: linear-gradient(160deg, #BFFF8A 0%, #9FE870 50%, #5CB835 100%);
          display: flex; flex-direction: column; justify-content: flex-end;
        }
        [data-composition-id="app-showcase"] .left-shapes {
          position: absolute; top: 40px; left: 0; width: 100%; height: 400px;
          display: flex; align-items: center; justify-content: center;
        }
        [data-composition-id="app-showcase"] .left-shapes svg { width: 200px; height: 280px; }
        [data-composition-id="app-showcase"] .left-bottom { padding: 0 28px 40px; position: relative; z-index: 2; }
        [data-composition-id="app-showcase"] .left-tagline {
          font-size: 28px; font-weight: 700; color: #163300;
          line-height: 1.15; margin-bottom: 16px; letter-spacing: -0.02em;
        }
        [data-composition-id="app-showcase"] .left-cta {
          display: inline-block; background: #163300; color: #BFFF8A;
          font-size: 13px; font-weight: 700; letter-spacing: 0.1em;
          padding: 12px 28px; border-radius: 24px;
        }

        /* Center screen  -  dark dashboard */
        [data-composition-id="app-showcase"] .s3-screen-center {
          background: #0F1F0A; padding: 42px 22px 22px;
          display: flex; flex-direction: column; gap: 18px;
        }
        [data-composition-id="app-showcase"] .center-header { display: flex; align-items: center; gap: 10px; }
        [data-composition-id="app-showcase"] .center-avatar {
          width: 40px; height: 40px; border-radius: 50%;
          background: linear-gradient(135deg, #BFFF8A, #9FE870);
          display: flex; align-items: center; justify-content: center;
          font-size: 15px; font-weight: 700; color: #163300; flex-shrink: 0;
        }
        [data-composition-id="app-showcase"] .center-user-info { flex: 1; }
        [data-composition-id="app-showcase"] .center-name {
          font-size: 18px; font-weight: 700; color: #F1F2EC; line-height: 1.2;
        }
        [data-composition-id="app-showcase"] .center-subtitle {
          font-size: 12px; font-weight: 400; color: #7c857c; margin-top: 1px;
        }
        [data-composition-id="app-showcase"] .center-bell { flex-shrink: 0; }

        [data-composition-id="app-showcase"] .center-goal {
          background: #1A2D14; border-radius: 20px; padding: 18px 16px;
          display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        [data-composition-id="app-showcase"] .goal-label {
          font-size: 15px; font-weight: 500; color: #7c857c; align-self: flex-start;
        }
        [data-composition-id="app-showcase"] .goal-ring-wrap { position: relative; width: 130px; height: 130px; }
        [data-composition-id="app-showcase"] .goal-ring { width: 100%; height: 100%; }
        [data-composition-id="app-showcase"] .ring-track { opacity: 0.3; }
        [data-composition-id="app-showcase"] .goal-count {
          position: absolute; inset: 0; display: flex;
          align-items: center; justify-content: center; gap: 1px;
        }
        [data-composition-id="app-showcase"] .goal-cur { font-size: 20px; font-weight: 700; color: #9FE870; }
        [data-composition-id="app-showcase"] .goal-num { font-size: 26px; font-weight: 700; color: #9FE870; letter-spacing: -0.5px; }
        [data-composition-id="app-showcase"] .goal-days { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
        [data-composition-id="app-showcase"] .day {
          min-width: 28px; height: 28px; border-radius: 14px; padding: 0 8px;
          display: flex; align-items: center; justify-content: center;
          font-size: 11px; font-weight: 600; color: #7c857c; background: #0A1F00;
        }
        [data-composition-id="app-showcase"] .day.done { background: #9FE870; color: #163300; font-weight: 700; }

        [data-composition-id="app-showcase"] .center-progress {
          flex: 1; display: flex; flex-direction: column; gap: 12px;
        }
        [data-composition-id="app-showcase"] .progress-header {
          display: flex; justify-content: space-between; align-items: center;
        }
        [data-composition-id="app-showcase"] .progress-title { font-size: 15px; font-weight: 500; color: #F1F2EC; }
        [data-composition-id="app-showcase"] .progress-link  { font-size: 12px; font-weight: 400; color: #9FE870; }
        [data-composition-id="app-showcase"] .progress-bars  { display: flex; flex-direction: column; gap: 12px; }
        [data-composition-id="app-showcase"] .bar-row { display: flex; align-items: center; gap: 10px; }
        [data-composition-id="app-showcase"] .bar-icon {
          width: 28px; height: 28px; border-radius: 8px; background: #1A2D14;
          display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        [data-composition-id="app-showcase"] .flag-letter { color: #9FE870; font-weight: 700; font-size: 14px; }
        [data-composition-id="app-showcase"] .bar-info { width: 70px; flex-shrink: 0; }
        [data-composition-id="app-showcase"] .bar-name {
          display: block; font-size: 12px; font-weight: 500; color: #F1F2EC; line-height: 1.2;
        }
        [data-composition-id="app-showcase"] .bar-val {
          display: block; font-size: 10px; font-weight: 400; color: #7c857c;
        }
        [data-composition-id="app-showcase"] .bar-track {
          flex: 1; height: 8px; background: #1A2D14; border-radius: 4px; overflow: hidden;
        }
        [data-composition-id="app-showcase"] .bar-value {
          height: 100%; border-radius: 4px; background: #9FE870; width: 0%;
        }

        /* Right screen  -  light spending */
        [data-composition-id="app-showcase"] .s3-screen-right {
          background: #F1F8E8; padding: 42px 20px 24px;
          display: flex; flex-direction: column; gap: 14px;
        }
        [data-composition-id="app-showcase"] .right-header { display: flex; flex-direction: column; gap: 4px; }
        [data-composition-id="app-showcase"] .right-title { font-size: 14px; font-weight: 500; color: #5C7050; }
        [data-composition-id="app-showcase"] .right-value {
          font-size: 36px; font-weight: 700; color: #163300; line-height: 1; letter-spacing: -0.03em;
        }
        [data-composition-id="app-showcase"] .right-unit { font-size: 20px; font-weight: 400; color: #5C7050; }
        [data-composition-id="app-showcase"] .right-graph-wrap { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        [data-composition-id="app-showcase"] .right-graph { width: 100%; flex: 1; }
        [data-composition-id="app-showcase"] .right-labels {
          display: flex; justify-content: space-between; padding: 0 6px;
          font-size: 10px; font-weight: 400; color: #5C7050;
        }
        [data-composition-id="app-showcase"] .right-stats { display: flex; gap: 12px; }
        [data-composition-id="app-showcase"] .stat-pill {
          display: flex; align-items: center; gap: 6px;
          background: #DFF0BC; border-radius: 20px; padding: 8px 14px;
        }
        [data-composition-id="app-showcase"] .stat-dot {
          width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
        }
        [data-composition-id="app-showcase"] .stat-label { font-size: 12px; font-weight: 400; color: #5C7050; }
        [data-composition-id="app-showcase"] .stat-num   { font-size: 13px; font-weight: 700; color: #163300; }
      </style>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          var S = '[data-composition-id="app-showcase"] ';
          window.__timelines = window.__timelines || {};
          var tl = gsap.timeline({ paused: true });

          // SVG setup
          var graphLine = document.querySelector(S + "#s3GraphLine");
          var graphLen = graphLine.getTotalLength();
          gsap.set(graphLine, { strokeDasharray: graphLen, strokeDashoffset: graphLen });

          var graphArea = document.querySelector(S + "#s3GraphArea");
          gsap.set(graphArea, { opacity: 0 });

          var graphDots = document.querySelectorAll(S + ".graph-dot");
          gsap.set(graphDots, { opacity: 0, scale: 0 });

          var CIRC = 2 * 3.14159265 * 52;
          gsap.set(S + "#s3Ring", { strokeDasharray: CIRC, strokeDashoffset: CIRC });

          // Initial states
          gsap.set(S + ".s3-bg", { opacity: 0 });
          gsap.set(S + ".s3-bg-glow", { opacity: 0 });
          gsap.set(S + "#s3PhoneCenter", { opacity: 0, scale: 0.85 });
          gsap.set(S + "#s3PhoneLeft", { opacity: 0, x: 0, rotation: 0 });
          gsap.set(S + "#s3PhoneRight", { opacity: 0, x: 0, rotation: 0 });
          gsap.set(S + ".bar-value", { width: "0%" });
          gsap.set(S + "#s3Tagline", { opacity: 0, y: 20 });
          gsap.set(S + ".left-cta", { opacity: 0, y: 12 });

          // BUILD PHASE (0-2s)
          tl.to(S + ".s3-bg", { opacity: 1, duration: 0.8, ease: "power1.out" }, 0);
          tl.to(S + ".s3-bg-glow", { opacity: 1, duration: 1.2, ease: "power1.out" }, 0.2);

          tl.to(S + "#s3PhoneCenter", { scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.4)" }, 0.2);

          tl.to(S + "#s3PhoneLeft", { opacity: 1, duration: 0.7, ease: "back.out(1.4)" }, 0.3);
          tl.to(S + "#s3PhoneLeft", { x: -340, rotation: -12, duration: 1.2, ease: "expo.out" }, 0.3);

          tl.to(S + "#s3PhoneRight", { opacity: 1, duration: 0.7, ease: "back.out(1.4)" }, 0.4);
          tl.to(S + "#s3PhoneRight", { x: 340, rotation: 12, duration: 1.2, ease: "expo.out" }, 0.4);

          // BREATHE PHASE (2-4s)
          tl.to(S + "#s3Ring", { strokeDashoffset: CIRC * (1 - 0.78), duration: 1.2, ease: "circ.out" }, 1.8);

          // Currency holdings bars (GBP=80%, EUR=58%, USD=30%)
          tl.to(S + "#s3Bar1", { width: "80%", duration: 0.8, ease: "power3.out" }, 2.1);
          tl.to(S + "#s3Bar2", { width: "58%", duration: 0.8, ease: "power3.out" }, 2.3);
          tl.to(S + "#s3Bar3", { width: "30%", duration: 0.8, ease: "power3.out" }, 2.5);

          tl.to(graphLine, { strokeDashoffset: 0, duration: 1.4, ease: "sine.inOut" }, 2.0);
          tl.to(graphArea, { opacity: 0.18, duration: 0.8, ease: "power1.out" }, 2.6);

          tl.to(graphDots, {
            opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)",
            stagger: { each: 0.06, ease: "power2.in" },
          }, 3.0);

          tl.to(S + "#s3Tagline", { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 2.2);
          tl.to(S + ".left-cta",  { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.5);

          tl.to(S + "#s3Stage", { scale: 1.02, duration: 3.5, ease: "sine.inOut" }, 2.0);

          // RESOLVE (4-5.5s)  -  gentle pulse on lime accents
          tl.to(S + ".ring-fill", { opacity: 0.65, duration: 0.6, ease: "sine.inOut" }, 4.0);
          tl.to(S + ".ring-fill", { opacity: 1,    duration: 0.6, ease: "sine.inOut" }, 4.6);
          tl.to(S + ".bar-value", { opacity: 0.7,  duration: 0.6, ease: "sine.inOut" }, 4.1);
          tl.to(S + ".bar-value", { opacity: 1,    duration: 0.6, ease: "sine.inOut" }, 4.7);
          tl.to(graphLine,        { opacity: 0.65, duration: 0.6, ease: "sine.inOut" }, 4.05);
          tl.to(graphLine,        { opacity: 1,    duration: 0.6, ease: "sine.inOut" }, 4.65);

          window.__timelines["app-showcase"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
