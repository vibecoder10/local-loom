<!-- Ported from a Remotion component: PerspectiveMarquee -->
<!-- Original: useCurrentFrame() drives translateX offset; per-item blur
     computed from layout-X distance to centre. -->
<!-- Hyperframes port: GSAP timeline animates row translateX; onUpdate
     recomputes per-item blur/opacity on every frame seek. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    margin: 0; width: 1920px; height: 1080px;
    overflow: hidden; background: #0A1F00;
  }
</style>
</head>
<body>
<div
  id="perspective-marquee"
  data-composition-id="perspective-marquee"
  data-start="0"
  data-duration="12"
  data-width="1920"
  data-height="1080"
>
  <!-- background -->
  <div id="pm-bg"></div>

  <!-- Optional headline -->
  <div id="pm-headline">Send to <span class="pm-accent">70+</span> countries</div>

  <!-- Stage -->
  <div id="pm-stage">
    <div id="pm-row">
      <!-- spans built by JS -->
    </div>
  </div>

  <!-- Fade overlays (horizontal + vertical) -->
  <div id="pm-fade-h"></div>
  <div id="pm-fade-v"></div>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap");

    #perspective-marquee {
      position: relative; width: 1920px; height: 1080px;
      overflow: hidden; perspective: 1500px;
      font-family: "Inter", system-ui, sans-serif;
    }
    #perspective-marquee #pm-bg {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, #163300 0%, #0A1F00 70%);
    }

    #perspective-marquee #pm-headline {
      position: absolute; top: 110px; left: 0; right: 0;
      text-align: center;
      font-size: 48px; font-weight: 500; letter-spacing: -0.5px;
      color: #F1F2EC; opacity: 0.85; z-index: 5;
    }
    #perspective-marquee .pm-accent {
      color: #9FE870; font-weight: 800;
    }

    #perspective-marquee #pm-stage {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: flex-start;
      transform: rotateX(8deg) rotateY(-28deg);
      transform-style: preserve-3d;
      transform-origin: center center;
    }
    #perspective-marquee #pm-row {
      display: flex; white-space: nowrap;
      will-change: transform;
    }
    #perspective-marquee .pm-item {
      display: inline-block;
      font-size: 132px; font-weight: 800;
      color: #F1F2EC; letter-spacing: -0.04em;
      padding-right: 120px;
      will-change: filter, opacity;
    }

    #perspective-marquee #pm-fade-h {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(90deg, #0A1F00 0%, transparent 18%, transparent 82%, #0A1F00 100%);
      z-index: 10;
    }
    #perspective-marquee #pm-fade-v {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, #0A1F00 0%, transparent 25%, transparent 75%, #0A1F00 100%);
      z-index: 10;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var items = [
        "London",
        "Singapore",
        "New York",
        "Tokyo",
        "Sydney",
        "Berlin",
        "Mumbai",
        "Paris",
      ];

      // Build 3x copies for seamless loop
      var row = document.getElementById("pm-row");
      var allItems = items.concat(items).concat(items);
      allItems.forEach(function (label) {
        var s = document.createElement("span");
        s.className = "pm-item";
        s.textContent = label;
        row.appendChild(s);
      });

      // Measure: get total width of one set
      var spans = row.querySelectorAll(".pm-item");
      var oneSetWidth = 0;
      for (var i = 0; i < items.length; i++) {
        oneSetWidth += spans[i].offsetWidth;
      }

      var compWidth = 1920;
      var compCentre = compWidth / 2;

      // Helper: distance-based blur (same shape as the Remotion source)
      function applyBlurAt(currentX) {
        spans.forEach(function (el, idx) {
          var spanLeft = el.offsetLeft;
          var spanCentre = spanLeft + el.offsetWidth / 2 + currentX;
          var norm = (spanCentre - compCentre) / compCentre;
          var distance = Math.min(1, Math.abs(norm));
          var blur = distance * 6;
          var op = 1 - distance * 0.4;
          el.style.filter = "blur(" + blur.toFixed(2) + "px)";
          el.style.opacity = op.toFixed(3);
        });
      }

      // Initial state
      applyBlurAt(0);

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Headline fade in
      tl.from("#perspective-marquee #pm-headline", {
        opacity: 0, y: -16, duration: 0.8, ease: "power2.out",
      }, 0.2);

      // Continuous translateX, linear ease
      // 12s scene; we want one full cycle to take ~6s so we see ~2 cycles
      var pixelsPerSecond = oneSetWidth / 6;
      var totalTravel = pixelsPerSecond * 12;

      tl.to("#perspective-marquee #pm-row", {
        x: -totalTravel,
        duration: 12,
        ease: "none",
        modifiers: {
          // wrap so it loops cleanly even though we go past 1 cycle
          x: function (xv) {
            var n = parseFloat(xv);
            // Re-wrap into [-oneSetWidth, 0]
            n = ((n % oneSetWidth) + oneSetWidth) % oneSetWidth;
            return -n + "px";
          },
        },
        onUpdate: function () {
          var currentX = parseFloat(gsap.getProperty("#perspective-marquee #pm-row", "x"));
          applyBlurAt(currentX);
        },
      }, 0);

      window.__timelines["perspective-marquee"] = tl;
    })();
  </script>
</div>
</body>
</html>
