<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Eight-reel spotlight template</title><script src="assets/vendor/gsap.min.js"></script><style>@font-face{font-family:Outfit;src:url('assets/fonts/outfit.woff2');font-weight:100 900}*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden}#reel-wall{width:1920px;height:1080px;position:relative;overflow:hidden;background:#f2efe8;background-image:radial-gradient(#c8bfa633 1px,transparent 1px);background-size:12px 12px;color:#1c1a16;font-family:Outfit,sans-serif}.slot,.reel{position:absolute;width:250px;height:444.444px;border-radius:29px;transform-origin:50% 50%}.slot{border:2px dashed #c8bda7;background:#e8e2d21a}.reel{background:#faf8f2;border:2px solid #c9c0af;box-shadow:0 8px 22px #1c1a1620;will-change:transform,filter;overflow:hidden}.frame-inner{position:absolute;inset:0;overflow:hidden;border-radius:26px}.texture{position:absolute;inset:0;background-image:radial-gradient(#c6bca433 .8px,transparent .8px);background-size:7px 7px}.motif{position:absolute;left:23px;top:58px;width:204px;height:230px;color:#9d927e}.reel-name{position:absolute;left:10px;right:10px;top:22px;font-size:33px;font-weight:600;text-align:center;letter-spacing:-1px}.play-indicator{position:absolute;bottom:40px;left:91px;width:68px;height:68px;border:1.5px solid #bfb29b;border-radius:50%;display:grid;place-items:center;background:#f2efe8;color:#1c1a16}.play-indicator svg{width:46px;height:46px}.segment{position:absolute;bottom:29px;left:50px;right:50px;display:flex;height:50px;gap:6px;align-items:center;justify-content:center;opacity:0}.segment i{width:7px;height:14px;border-radius:5px;background:#ff6b1a}.reel.is-active{border-color:#ff6b1a;box-shadow:0 0 0 2px #ff6b1a22,0 30px 100px #1c1a1645}.reel.is-active .motif{color:#6f6a5c}.reel.is-playing .play-indicator{opacity:0}.reel.is-playing .segment{opacity:1}.reel:nth-of-type(3n){background:#e8e2d2}.reel:nth-of-type(4n){background:#eee8dc}</style></head><body><main id="reel-wall" data-composition-id="reel-wall" data-width="1920" data-height="1080" data-duration="22.2"><div class="slot" id="slot-1"></div><article class="reel" id="reel-1"><div class="frame-inner"><div class="texture"></div><svg class="motif" viewBox="0 0 300 340" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><rect x="55" y="85" width="190" height="140" rx="18"/><path d="m128 124 54 31-54 31Z"/></svg><div class="reel-name">Reel 1</div><div class="play-indicator"><svg viewBox="0 0 60 60" fill="currentColor"><path d="m23 15 23 15-23 15Z"/></svg></div><div class="segment"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></article><div class="slot" id="slot-2"></div><article class="reel" id="reel-2"><div class="frame-inner"><div class="texture"></div><svg class="motif" viewBox="0 0 300 340" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="m150 60 95 55v110l-95 55-95-55V115Z"/><path d="m55 115 95 55 95-55M150 170v110"/></svg><div class="reel-name">Reel 2</div><div class="play-indicator"><svg viewBox="0 0 60 60" fill="currentColor"><path d="m23 15 23 15-23 15Z"/></svg></div><div class="segment"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></article><div class="slot" id="slot-3"></div><article class="reel" id="reel-3"><div class="frame-inner"><div class="texture"></div><svg class="motif" viewBox="0 0 300 340" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="150" cy="170" r="93"/><circle cx="150" cy="170" r="61"/><circle cx="150" cy="170" r="17"/></svg><div class="reel-name">Reel 3</div><div class="play-indicator"><svg viewBox="0 0 60 60" fill="currentColor"><path d="m23 15 23 15-23 15Z"/></svg></div><div class="segment"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></article><div class="slot" id="slot-4">< s="texture"></div><svg class="motif" viewBox="0 0 300 340" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M55 210V125l60-35 70 42 60-35v92l-60 35-70-42Z"/><path d="M115 90v92m70-50v92"/></svg><div class="reel-name">Reel 7</div><div class="play-indicator"><svg viewBox="0 0 60 60" fill="currentColor"><path d="m23 15 23 15-23 15Z"/></svg></div><div class="segment"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></article><div class="slot" id="slot-8"></div><article class="reel" id="reel-8"><div class="frame-inner"><div class="texture"></div><svg class="motif" viewBox="0 0 300 340" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="150" cy="175" r="90"/><path d="m80 175 45 45 95-100"/></svg><div class="reel-name">Reel 8</div><div class="play-indicator"><svg viewBox="0 0 60 60" fill="currentColor"><path d="m23 15 23 15-23 15Z"/></svg></div><div class="segment"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></article></main><script>
const SETTINGS={transition:.4,hold:1.6,gap:.2,lead:.7,tail:.7,order:[1,3,7,2,8,4,6,5],blur:30};
const WIDTH=1920,HEIGHT=1080,CARD_W=250,CARD_H=444.444,FOCUS_H=920,SCALE=FOCUS_H/CARD_H;
const cards=[...document.querySelectorAll('.reel')],slots=[...document.querySelectorAll('.slot')];
const positions=cards.map((el,i)=>{const p={x:310+(i%4)*350,y:i<4?72:564};for(const node of [el,slots[i]]){node.style.left=p.x+'px';node.style.top=p.y+'px';}return p;});
let shuffleSeed=781;function shuffleRandom(){shuffleSeed=(Math.imul(shuffleSeed,1664525)+1013904223)>>>0;return shuffleSeed/4294967296;}const clamp=x=>Math.max(0,Math.min(1,x));
// Sharp acceleration and deceleration, with exact endpoints.
function sharp(p){p=clamp(p);if(p===0||p===1)return p;return p<.5?Math.pow(2,20*p-10)/2:(2-Math.pow(2,-20*p+10))/2;}
function duration(){return SETTINGS.lead+8*(SETTINGS.transition*2+SETTINGS.hold+SETTINGS.gap)+SETTINGS.tail;}
function stateAt(t){const cycle=SETTINGS.transition*2+SETTINGS.hold+SETTINGS.gap,index=Math.floor((t-SETTINGS.lead)/cycle);if(index<0||index>=8)return {active:0,progress:0,blur:0,phase:'grid'};const local=t-SETTINGS.lead-index*cycle,T=SETTINGS.transition,H=SETTINGS.hold;if(local<T){const p=clamp(local/T);return {active:SETTINGS.order[index],progress:sharp(p),blur:SETTINGS.blur*Math.pow(Math.sin(Math.PI*p),1.3),phase:'enter',index};}if(local<T+H)return {active:SETTINGS.order[index],progress:1,blur:0,phase:'hold',playTime:local-T,index};if(local<2*T+H){const p=clamp((local-T-H)/T);return {active:SETTINGS.order[index],progress:1-sharp(p),blur:SETTINGS.blur*Math.pow(Math.sin(Math.PI*p),1.3),phase:'return',index};}return {active:0,progress:0,blur:0,phase:'grid',index};}
function renderAt(t){const state=stateAt(t);cards.forEach((el,i)=>{const active=i+1===state.active,p=active?state.progress:0,pos=positions[i],dx=WIDTH/2-(pos.x+CARD_W/2),dy=HEIGHT/2-(pos.y+CARD_H/2);el.classList.toggle('is-active',active&&p>.01);el.classList.toggle('is-playing',active&&state.phase==='hold');el.style.zIndex=active?100:2;slots[i].style.opacity=String(1-state.progress*.9);el.style.willChange=active&&state.phase!=='hold'?'transform,filter':'auto';el.style.transform='translate('+(dx*p)+'px,'+(dy*p)+'px) scale('+(1+(SCALE-1)*p)+')';el.style.filter='blur('+(active?state.blur:state.progress*2.5)+'px)';el.style.opacity=String(active?1:1-state.progress*.87);el.querySelectorAll('.segment i').forEach((bar,j)=>{const k=state.playTime||0;bar.style.height=(12+Math.abs(Math.sin(k*5+j*.7))*32)+'px';});});window.currentState={...state,time:t};if(parent!==window&&window.__timelines)publishState();}
const tl=gsap.timeline({paused:true});tl.to({},{duration:duration()},0);tl.eventCallback('onUpdate',()=>renderAt(tl.time()));window.__timelines={'reel-wall':tl};window.addEventListener('hf-seek',e=>renderAt(e.detail.time));window.template={settings:SETTINGS,stateAt,renderAt,duration,shuffle(){let order=[1,2,3,4,5,6,7,8];for(let i=7;i>0;i--){const j=Math.floor(shuffleRandom()*(i+1));[order[i],order[j]]=[order[j],order[i]];}SETTINGS.order=order;tl.pause(0);renderAt(0);return order;}};function publishState(){if(parent!==window)parent.postMessage({type:'reel-wall-state',time:tl.time(),duration:tl.duration(),paused:tl.paused(),order:SETTINGS.order},'*');}window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='reel-wall-control')return;const cmd=e.data.command;if(cmd==='toggle'){if(tl.paused()){if(tl.time()>=tl.duration())tl.seek(0);tl.play();}else tl.pause();}if(cmd==='restart')tl.restart();if(cmd==='seek'){tl.pause().seek(Number(e.data.time));renderAt(Number(e.data.time));}if(cmd==='shuffle')window.template.shuffle();publishState();});renderAt(0);window.previewReady=true;publishState();
</script></body></html>
